<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>400 - Bad Request</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f4f6f9;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .container {
            background: white;

            padding: 40px;

            border-radius: 14px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.08);

            max-width: 500px;
        }

        h1 {
            color: #c62828;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            background: #1976d2;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

        a:hover {
            background: #125aa0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>400 - Bad Request</h1>

        <p>
            The request could not be processed due to invalid input
            or malformed request data.
        </p>

        <a href="/">Return Home</a>
    </div>
</body>
</html>
